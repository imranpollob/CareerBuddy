[project]
name = "skillpilot"
version = "0.1.0"
description = "Local-first career intelligence MVP using Strands and Bedrock"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.163.0", "uvicorn[standard]==0.54.0", "strands-agents==1.65.0",
  "boto3==1.44.3", "pydantic-settings==2.16.3", "httpx==0.28.1",
  "bedrock-agentcore==1.26.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "moto[dynamodb]==5.2.5", "awscli==1.46.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
